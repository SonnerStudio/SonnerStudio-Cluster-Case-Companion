[project]
name = "ss-ccc"
version = "0.1.0"
description = "SonnerStudio Cluster-Case-Companion (SS-CCC): Hybrid Thunderbolt/RDMA + LAN/WLAN distributed MLX cluster for Apple Silicon Macs"
requires-python = ">=3.12"
dependencies = [
    "mlx>=0.22.0",
    "mlx-lm>=0.21.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "psutil>=6.1.0",
    "zeroconf>=0.136.0",
    "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core"]
